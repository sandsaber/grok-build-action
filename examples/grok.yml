name: Grok Build

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

jobs:
  grok:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@grok')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@grok')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@grok')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@grok') || contains(github.event.issue.title, '@grok') || (github.event.action == 'labeled' && github.event.label.name == 'grok')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Grok Build
        uses: sandsaber/grok-build-action@main
        with:
          xai_api_key: ${{ secrets.XAI_API_KEY }}
